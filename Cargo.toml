[package]
name = "tarpack"
version = "0.1.0"
edition = "2021"
description = "A tar packaging tool that honors .packignore (gitignore-compatible) rules."
license = "MIT"

[[bin]]
name = "tarpack"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
tar = "0.4"

[profile.release]
strip = true
lto = true
