[package]
name = "tarpack"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A tar packaging tool that honors .packignore (gitignore-compatible) rules."
license = "GPL-3.0-only"
license-file = "LICENSE"
repository = "https://github.com/Linux-System-0/tarpack"
readme = "README.md"
keywords = ["tar", "archive", "pack", "ignore", "gitignore"]
categories = ["command-line-utilities", "filesystem"]
exclude = [
    ".github/",
    "*.md",
    "docs/",
    "tests/",
    ".gitignore",
    ".gitattributes",
]

[[bin]]
name = "tarpack"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
tar = "0.4"
colored = "2.1"

[profile.release]
strip = true
lto = true
