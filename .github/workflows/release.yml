name: Release

# Releases are cut from v* tags (for example v1.2.3), never from pushes to
# main. The tag must match the version in Cargo.toml. Before anything is
# published, the full CI suite is run by calling the reusable ci.yml workflow,
# so a tag whose checks fail cannot reach crates.io. The workflow publishes only
# to crates.io; it does not create a GitHub release or upload binaries.
#
# Publishing requires a CARGO_REGISTRY_TOKEN repository secret with an API
# token that has permission to publish the `tarpack` crate.
on:
  push:
    tags:
      - "v*"
  # Manual runs must be started from an existing v* tag ref; the tag is
  # validated below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Verify tag matches Cargo.toml
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *)
              echo "::error::releases must run from a v* tag (got '$tag')"
              exit 1
              ;;
          esac
          version="$(cargo tree --depth 0 --locked \
            | awk '/^tarpack v/{print $2}')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$tag' does not match Cargo.toml version '$version'"
            exit 1
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    with:
      release_gate: true

  publish-crates-io:
    name: Publish to crates.io
    needs: [verify-tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Check whether the version is already published
        id: check
        env:
          CRATE_VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          # Make reruns idempotent: a release can be retried after a partial
          # failure without a second cargo publish, which would fail because
          # crates.io versions are immutable.
          status="$(curl -sS -A "tarpack-release-workflow" -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/tarpack/$CRATE_VERSION")"
          if [ "$status" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tarpack $CRATE_VERSION is already on crates.io; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::missing CARGO_REGISTRY_TOKEN secret; add a crates.io API token in the repository settings"
            exit 1
          fi
          cargo publish --locked
