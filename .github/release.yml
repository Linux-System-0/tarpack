changelog:
  exclude:
    labels:
      - skip-changelog
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels:
        - breaking
        - breaking-change
    - title: New features
      labels:
        - enhancement
        - feature
    - title: Bug fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: CI, build and tooling
      labels:
        - ci
        - build
        - tooling
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
